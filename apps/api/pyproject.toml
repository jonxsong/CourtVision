[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "courtvision-api"
version = "0.1.0"
description = "CourtVision analytics API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "orjson>=3.10,<4",
  "pandas>=2.2,<3",
  "pydantic-settings>=2.7,<3",
  "redis>=5.2,<6",
  "scikit-learn>=1.6,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
ml = ["xgboost>=2.1,<4", "joblib>=1.4,<2"]
ai = ["openai-agents>=0.0.17"]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["courtvision"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["joblib", "pandas", "pandas.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["courtvision"]
branch = true
omit = [
  "*/database.py",
  "*/models.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
