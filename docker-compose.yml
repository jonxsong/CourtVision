services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: courtvision
      POSTGRES_USER: courtvision
      POSTGRES_PASSWORD: courtvision
    ports:
      - "5432:5432"
    volumes:
      - courtvision-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtvision"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      COURTVISION_DATABASE_URL: postgresql+asyncpg://courtvision:courtvision@postgres:5432/courtvision
      COURTVISION_REDIS_URL: redis://redis:6379/0
      COURTVISION_CORS_ORIGINS: '["http://localhost:3000"]'
      COURTVISION_DATA_PROVIDER: demo
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      INTERNAL_API_URL: http://api:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  courtvision-postgres:
